name: Rebuild game assets

on:
  push:
    paths:
      - 'public/_base64-mini.txt'
      - 'public/_base64-item.txt'
      - '.github/workflows/rebuild-game-assets.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebuild WebP assets and clean up
        shell: bash
        run: |
          set -euo pipefail
          test -f public/_base64-mini.txt || exit 0
          test -f public/_base64-item.txt || exit 0
          base64 -d public/_base64-mini.txt > public/mini-game-button.webp
          base64 -d public/_base64-item.txt > public/item-catch-card.webp
          file public/mini-game-button.webp
          file public/item-catch-card.webp
          sed -i 's#https://raw.githubusercontent.com/nsaya0607ta-lab/odekake/main/public/mini-game-button.webp#/mini-game-button.webp#g' 'src/app/(app)/home/page.tsx'
          sed -i 's#https://raw.githubusercontent.com/nsaya0607ta-lab/odekake/main/public/item-catch-card.webp#/item-catch-card.webp#g' 'src/app/(app)/games/page.tsx'
          rm -f public/_base64-mini.txt public/_base64-item.txt public/_test.txt public/_noop.txt public/_debug-note.txt
          rm -f .github/workflows/rebuild-game-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix game asset binaries and local image paths'
          git push origin HEAD:main
