name: Town migration check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: town_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Supabase-compatible stubs
        run: |
          psql -h 127.0.0.1 -U postgres -d town_check -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create role authenticated;
          create role anon;
          create schema auth;
          create table auth.users (id uuid primary key);
          create function auth.uid() returns uuid language sql stable as $$ select null::uuid $$;
          create function public.set_updated_at() returns trigger language plpgsql as $$
          begin
            new.updated_at = now();
            return new;
          end;
          $$;
          SQL
      - name: Apply town migration
        run: psql -h 127.0.0.1 -U postgres -d town_check -v ON_ERROR_STOP=1 -f supabase/migrations/0085_wanko_town_phase1.sql
      - name: Verify town schema
        run: |
          psql -h 127.0.0.1 -U postgres -d town_check -v ON_ERROR_STOP=1 <<'SQL'
          select count(*) = 5 as catalog_seeded from public.town_catalog_items;
          select public.town_level_of(140) = 2 as level_rule_ok;
          select public.town_cell_is_unlocked(array['core']::text[], 3, 3) as core_unlocked;
          SQL
