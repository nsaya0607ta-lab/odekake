name: Android step sync

on:
  pull_request:
    paths:
      - "android-step-sync/**"
      - ".github/workflows/android-step-sync.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-step-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: odekake-step-sync-debug
          path: android-step-sync/app/build/outputs/apk/debug/app-debug.apk
