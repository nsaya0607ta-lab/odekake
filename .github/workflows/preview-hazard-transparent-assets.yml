name: Preview hazard transparent assets

on:
  push:
    branches:
      - preview/item-catch-hazards
    paths:
      - .github/workflows/preview-hazard-transparent-assets.yml
      - public/collection/items/0A579968-29E0-439D-A98A-92F38CC0B038.jpg
      - public/collection/items/898B8C7F-E0C5-414C-A97D-402017BE9243.jpg
      - public/collection/items/8AAFDB10-3454-496D-ACE2-57BA967B05D5.jpg
      - public/collection/items/FE1C526C-89E3-4B22-BD4F-4C7E8FA6D605.jpg

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate real transparent WebP assets
        shell: bash
        run: |
          python <<'PY'
          from collections import deque
          from pathlib import Path
          from PIL import Image

          files = {
              "public/collection/items/0A579968-29E0-439D-A98A-92F38CC0B038.jpg": "public/collection/items/hazard-time-minus.webp",
              "public/collection/items/FE1C526C-89E3-4B22-BD4F-4C7E8FA6D605.jpg": "public/collection/items/hazard-box-shrink.webp",
              "public/collection/items/8AAFDB10-3454-496D-ACE2-57BA967B05D5.jpg": "public/collection/items/hazard-blackout-squid.webp",
              "public/collection/items/898B8C7F-E0C5-414C-A97D-402017BE9243.jpg": "public/collection/items/hazard-stun-battery.webp",
          }

          def is_background_candidate(rgb):
              r, g, b = rgb
              lo = min(r, g, b)
              hi = max(r, g, b)
              return lo >= 218 and (hi - lo) <= 30

          def convert(src, dst):
              image = Image.open(src).convert("RGB")
              image.thumbnail((512, 512), Image.Resampling.LANCZOS)
              w, h = image.size
              px = image.load()
              visited = bytearray(w * h)
              q = deque()

              def index(x, y):
                  return y * w + x

              def add(x, y):
                  i = index(x, y)
                  if visited[i] or not is_background_candidate(px[x, y]):
                      return
                  visited[i] = 1
                  q.append((x, y))

              for x in range(w):
                  add(x, 0)
                  add(x, h - 1)
              for y in range(h):
                  add(0, y)
                  add(w - 1, y)

              while q:
                  x, y = q.popleft()
                  if x > 0: add(x - 1, y)
                  if x + 1 < w: add(x + 1, y)
                  if y > 0: add(x, y - 1)
                  if y + 1 < h: add(x, y + 1)

              rgba = image.convert("RGBA")
              out = rgba.load()
              for y in range(h):
                  for x in range(w):
                      if not visited[index(x, y)]:
                          continue
                      r, g, b = px[x, y]
                      lo = min(r, g, b)
                      if lo >= 250:
                          a = 0
                      else:
                          a = round((250 - lo) * 255 / 32)
                          a = max(0, min(255, a))

                      if 0 < a < 255:
                          af = a / 255.0
                          r = round((r - 255 * (1 - af)) / af)
                          g = round((g - 255 * (1 - af)) / af)
                          b = round((b - 255 * (1 - af)) / af)
                          r = max(0, min(255, r))
                          g = max(0, min(255, g))
                          b = max(0, min(255, b))
                      out[x, y] = (r, g, b, a)

              Path(dst).parent.mkdir(parents=True, exist_ok=True)
              rgba.save(dst, "WEBP", quality=92, method=6, exact=True)

              check = Image.open(dst).convert("RGBA")
              alpha = check.getchannel("A")
              lo, hi = alpha.getextrema()
              if lo != 0 or hi != 255:
                  raise RuntimeError(f"{dst}: alpha verification failed: {lo=}, {hi=}")
              print(f"generated {dst} ({check.size[0]}x{check.size[1]}, alpha {lo}-{hi})")

          for src, dst in files.items():
              convert(src, dst)
          PY

      - name: Commit transparent assets to Preview branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            public/collection/items/hazard-time-minus.webp \
            public/collection/items/hazard-box-shrink.webp \
            public/collection/items/hazard-blackout-squid.webp \
            public/collection/items/hazard-stun-battery.webp
          if git diff --cached --quiet; then
            echo "Transparent assets are already current."
            exit 0
          fi
          git commit -m "fix(preview): regenerate hazard assets with alpha"
          git push origin HEAD:preview/item-catch-hazards
