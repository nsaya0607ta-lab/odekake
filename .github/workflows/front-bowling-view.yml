name: Apply front bowling view

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/front-bowling-view.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update bowling lane perspective
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/components/wanko-bowling/lane.tsx')
          s = path.read_text()

          replacements = {
              'const HEAD_PIN_SCREEN_Y = 21.5;': 'const HEAD_PIN_SCREEN_Y = 18.8;',
              'const PIN_DECK_SCREEN_DEPTH_PCT = 8.4;': 'const PIN_DECK_SCREEN_DEPTH_PCT = 5.2;',
              'return 43 - 20 * Math.pow(depth, 0.68);': 'return 44 - 10 * Math.pow(depth, 0.82);',
              'return 4.6 - 1.6 * Math.pow(depth, 0.72);': 'return 6.2 - 1.2 * Math.pow(depth, 0.82);',
              'background: "radial-gradient(ellipse at 50% 8%, rgba(255,245,211,0.42) 0%, rgba(255,245,211,0.12) 34%, transparent 61%), linear-gradient(90deg, rgba(92,55,26,0.14) 0%, transparent 12%, transparent 88%, rgba(92,55,26,0.14) 100%), linear-gradient(180deg, #e5ba78 0%, #dcae6a 43%, #cf9854 100%)",': 'background: "radial-gradient(ellipse at 50% 6%, rgba(255,255,246,0.58) 0%, rgba(255,247,221,0.18) 32%, transparent 58%), repeating-linear-gradient(90deg, rgba(118,82,43,0.10) 0 1px, transparent 1px 8.2%), linear-gradient(180deg, #efd9aa 0%, #e6c789 46%, #d7ad68 100%)",',
              'boxShadow: "inset 18px 0 28px -24px rgba(62,37,20,0.48), inset -18px 0 28px -24px rgba(62,37,20,0.48), inset 0 15px 20px -20px rgba(255,248,225,0.72)",': 'boxShadow: "inset 14px 0 24px -20px rgba(82,57,34,0.34), inset -14px 0 24px -20px rgba(82,57,34,0.34), inset 0 18px 24px -22px rgba(255,255,247,0.88)",',
              'background: "linear-gradient(90deg, #241712 0%, #3c271c 50%, #69452e 82%, #9a6840 100%)",': 'background: "linear-gradient(90deg, #252824 0%, #545b55 38%, #9a9c91 68%, #d0c6ae 82%, #5c625c 100%)",',
              'boxShadow: "inset -7px 0 10px rgba(18,10,7,0.52), inset -1px 0 1px rgba(255,230,188,0.28)",': 'boxShadow: "inset -8px 0 12px rgba(20,23,21,0.58), inset -2px 0 2px rgba(255,250,232,0.42), 3px 0 8px rgba(45,35,25,0.18)",',
              'background: "linear-gradient(270deg, #241712 0%, #3c271c 50%, #69452e 82%, #9a6840 100%)",': 'background: "linear-gradient(270deg, #252824 0%, #545b55 38%, #9a9c91 68%, #d0c6ae 82%, #5c625c 100%)",',
              'boxShadow: "inset 7px 0 10px rgba(18,10,7,0.52), inset 1px 0 1px rgba(255,230,188,0.28)",': 'boxShadow: "inset 8px 0 12px rgba(20,23,21,0.58), inset 2px 0 2px rgba(255,250,232,0.42), -3px 0 8px rgba(45,35,25,0.18)",',
              'background: "linear-gradient(180deg, rgba(66,38,22,0.28) 0%, rgba(66,38,22,0.11) 14%, transparent 33%), radial-gradient(ellipse at 50% 20%, rgba(255,237,193,0.18) 0%, transparent 46%)",': 'background: "linear-gradient(180deg, rgba(70,49,31,0.20) 0%, rgba(70,49,31,0.07) 13%, transparent 30%), radial-gradient(ellipse at 50% 18%, rgba(255,252,232,0.24) 0%, transparent 48%)",',
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old[:100]}')
              s = s.replace(old, new, 1)

          marker = '      <svg className="pointer-events-none absolute inset-0 h-full w-full" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">'
          if marker not in s:
              raise SystemExit('SVG marker not found')

          front_depth = '''      {/* 正面からレーンを見ている感覚を強めるピンデッキとマスキングユニット。 */}
      <div
        className="pointer-events-none absolute z-[40]"
        style={{
          left: `${FAR_OUTER_LEFT - 4}%`,
          right: `${100 - FAR_OUTER_RIGHT - 4}%`,
          top: "0%",
          height: "24%",
          background: "linear-gradient(180deg, #171714 0%, #24231f 48%, #151513 100%)",
          boxShadow: "inset 0 -12px 22px rgba(0,0,0,0.54), 0 10px 18px rgba(45,31,19,0.16)",
        }}
        aria-hidden="true"
      />
      <div
        className="pointer-events-none absolute z-[45]"
        style={{
          left: `${FAR_OUTER_LEFT - 5.5}%`,
          right: `${100 - FAR_OUTER_RIGHT - 5.5}%`,
          top: "0%",
          height: "6.5%",
          borderRadius: "0 0 18px 18px",
          background: "linear-gradient(180deg, #9f6846 0%, #7f4d33 100%)",
          boxShadow: "0 5px 10px rgba(40,26,17,0.30), inset 0 -1px 0 rgba(255,236,211,0.28)",
        }}
        aria-hidden="true"
      />
      {[36, 50, 64].map((left) => (
        <span
          key={`deck-light-${left}`}
          className="pointer-events-none absolute z-[46] h-[4px] w-[10px] -translate-x-1/2 rounded-full bg-[#fff3d7]/85 shadow-[0_5px_13px_rgba(255,225,173,0.72)]"
          style={{ left: `${left}%`, top: "5.4%" }}
          aria-hidden="true"
        />
      ))}

'''
          s = s.replace(marker, front_depth + marker, 1)

          path.write_text(s)

          pins = Path('src/components/wanko-bowling/pins.tsx')
          p = pins.read_text()
          p = p.replace('export const PIN_VISUAL_WIDTH_PCT = 4.5;', 'export const PIN_VISUAL_WIDTH_PCT = 5.0;', 1)
          p = p.replace('drop-shadow(0 2px 1.4px rgba(54,35,22,0.38)) drop-shadow(0 -0.5px 0.5px rgba(255,255,255,0.26))', 'drop-shadow(0 3px 2px rgba(38,30,22,0.44)) drop-shadow(0 -0.7px 0.7px rgba(255,255,255,0.30))', 1)
          pins.write_text(p)

      - name: Commit visual update and remove workflow
        run: |
          rm .github/workflows/front-bowling-view.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Make bowling lane front-facing"
          git push origin main
