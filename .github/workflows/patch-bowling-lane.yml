name: Patch bowling lane controls

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-bowling-lane.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch lane behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/components/wanko-bowling/lane.tsx')
          text = path.read_text(encoding='utf-8')

          broken_mapping = 'return leftLaneEdge + laneT * 0 + JB_GUTTER_WIDTH_M + laneT * JB_LANE_WIDTH_M;'
          fixed_mapping = 'return JB_GUTTER_WIDTH_M + laneT * JB_LANE_WIDTH_M;'
          if broken_mapping not in text:
              raise SystemExit('screenXToWorldX target not found')
          text = text.replace(broken_mapping, fixed_mapping, 1)

          world_y_block = '''function worldYToPct(distanceFromFoulM: number): number {
            if (distanceFromFoulM <= JB_HEAD_PIN_DISTANCE_M) {
              const depth = clamp(distanceFromFoulM / JB_HEAD_PIN_DISTANCE_M, 0, 1);
              return DOCK_Y - (DOCK_Y - HEAD_PIN_SCREEN_Y) * Math.pow(depth, 0.9);
            }

            const deckDepth = (distanceFromFoulM - JB_HEAD_PIN_DISTANCE_M) / PIN_DECK_DEPTH_M;
            return HEAD_PIN_SCREEN_Y - deckDepth * PIN_DECK_SCREEN_DEPTH_PCT;
          }
          '''
          world_y_replacement = '''function worldYToPct(distanceFromFoulM: number): number {
            if (distanceFromFoulM <= JB_HEAD_PIN_DISTANCE_M) {
              const depth = clamp(distanceFromFoulM / JB_HEAD_PIN_DISTANCE_M, 0, 1);
              return DOCK_Y - (DOCK_Y - HEAD_PIN_SCREEN_Y) * Math.pow(depth, 0.9);
            }

            const deckDepth = (distanceFromFoulM - JB_HEAD_PIN_DISTANCE_M) / PIN_DECK_DEPTH_M;
            return HEAD_PIN_SCREEN_Y - deckDepth * PIN_DECK_SCREEN_DEPTH_PCT;
          }

          // ピンデッキに入った瞬間だけ画面上の移動量が急増しないよう、
          // ボールはレーン終端の投影速度を維持して奥へ抜けるように見せる。
          // 物理座標は従来どおり進めるので、衝突・スコア計算には影響しない。
          function ballWorldYToPct(distanceFromFoulM: number): number {
            if (distanceFromFoulM <= JB_HEAD_PIN_DISTANCE_M) {
              return worldYToPct(distanceFromFoulM);
            }

            const laneEndSlopePctPerM =
              ((DOCK_Y - HEAD_PIN_SCREEN_Y) * 0.9) / JB_HEAD_PIN_DISTANCE_M;
            const beyondHeadPinM = distanceFromFoulM - JB_HEAD_PIN_DISTANCE_M;
            return HEAD_PIN_SCREEN_Y - beyondHeadPinM * laneEndSlopePctPerM;
          }
          '''
          if world_y_block not in text:
              raise SystemExit('worldYToPct target not found')
          text = text.replace(world_y_block, world_y_replacement, 1)

          old_ball_position = '''    el.style.left = `${worldXToPct(xM, yM)}%`;
              el.style.top = `${worldYToPct(yM)}%`;
              el.style.width = `${ballVisualWidthPct(yM)}%`;
          '''
          new_ball_position = '''    el.style.left = `${worldXToPct(xM, yM)}%`;
              el.style.top = `${ballWorldYToPct(yM)}%`;
              el.style.width = `${ballVisualWidthPct(yM)}%`;

              // 1番ピンより奥ではボールをピットへ自然に消して、
              // 遠近投影の切り替わりが「急加速」に見えないようにする。
              if (yM > JB_HEAD_PIN_DISTANCE_M) {
                const fade = clamp(
                  (yM - JB_HEAD_PIN_DISTANCE_M) / Math.max(0.001, PIN_DECK_DEPTH_M * 0.9),
                  0,
                  1,
                );
                el.style.opacity = String(1 - fade);
              } else if (!dockingRef.current) {
                el.style.opacity = '1';
              }
          '''
          if old_ball_position not in text:
              raise SystemExit('setBallPosition target not found')
          text = text.replace(old_ball_position, new_ball_position, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/wanko-bowling/lane.tsx
          git commit -m "Fix bowling start position and post-pin motion"
          git push origin HEAD:main
