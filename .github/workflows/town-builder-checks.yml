name: Town Builder Checks

on:
  pull_request:
    paths:
      - "src/lib/games/town-*.ts"
      - "src/components/games/town-builder*"
      - "src/components/games/town-workshop.tsx"
      - "src/components/games/town-rpg.tsx"
      - "src/components/*coin*.tsx"
      - "src/components/login-bonus.tsx"
      - "src/components/wandering-frenchie.tsx"
      - "src/lib/data/white-coins.ts"
      - "src/lib/data/town-builder.ts"
      - "src/app/api/games/town-builder/**"
      - "src/app/api/coins/**"
      - "supabase/migrations/0141_white_coins_town_rpg.sql"
      - "supabase/migrations/0142_town_my_home.sql"
      - "supabase/migrations/0143_home_coin_drops_x1_5.sql"
      - "supabase/migrations/0144_town_park_parts.sql"
      - "supabase/migrations/0145_town_no_starter_coins.sql"
      - "src/components/games/use-town-sky.ts"
      - "src/lib/room/weather.ts"
      - "src/lib/room/sun.ts"
      - "src/lib/home-weather.ts"
      - "src/app/api/my-room/weather/**"
      - "src/components/bottom-nav.tsx"
      - "src/app/mini-games-preview/town-builder/**"
      - "scripts/test-town-builder*.cjs"
      - "src/middleware.ts"
      - "package.json"
      - "src/app/(app)/games/town-builder/page.tsx"
      - "src/app/(app)/games/page.tsx"
      - ".github/workflows/town-builder-checks.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:town
      - run: npx eslint src/components/games/town-builder.tsx src/components/games/town-rpg.tsx src/components/games/town-workshop.tsx src/components/coin-art.tsx src/components/coin-badge.tsx src/components/white-coin-section.tsx src/components/home-coin-art.tsx src/lib/data/white-coins.ts src/lib/data/town-builder.ts src/app/api/games/town-builder/route.ts src/app/api/coins/home-drop/route.ts src/app/api/coins/login-bonus/route.ts src/components/bottom-nav.tsx src/lib/games/town-builder.ts src/lib/games/town-progression.ts src/lib/games/town-commands.ts src/lib/games/town-renderer.ts src/lib/games/town-decorations.ts src/lib/games/town-transport.ts src/lib/games/town-sprites.ts src/lib/games/town-canvas.ts src/lib/games/town-builder-access.ts src/lib/games/town-touch-controls.ts src/lib/games/town-building-models.ts src/lib/games/town-environment.ts src/lib/games/town-life.ts src/lib/games/town-figures.ts src/lib/games/town-park-art.ts src/lib/games/town-park-motion.ts src/lib/games/town-park-paths.ts src/lib/games/town-paint.ts src/lib/games/town-sky.ts src/components/games/use-town-sky.ts src/app/api/my-room/weather/route.ts src/middleware.ts 'src/app/(app)/games/page.tsx' 'src/app/(app)/games/town-builder/page.tsx' src/app/mini-games-preview/town-builder/page.tsx
