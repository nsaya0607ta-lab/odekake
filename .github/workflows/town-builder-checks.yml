name: Town Builder Checks

on:
  pull_request:
    paths:
      - "src/lib/games/town-*.ts"
      - "src/components/games/town-builder*"
      - "src/app/mini-games-preview/town-builder/**"
      - "scripts/test-town-builder.cjs"
      - "src/middleware.ts"
      - "package.json"
      - "src/app/(app)/games/town-builder/page.tsx"
      - "src/app/(app)/games/page.tsx"
      - ".github/workflows/town-builder-checks.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:town
      - run: npx eslint src/components/games/town-builder.tsx src/lib/games/town-builder.ts src/lib/games/town-renderer.ts
