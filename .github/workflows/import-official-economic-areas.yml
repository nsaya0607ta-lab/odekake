name: Generate official prefecture areas

on:
  push:
    branches:
      - feat/official-prefecture-regions-20260805
    paths:
      - .github/workflows/import-official-economic-areas.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/official-prefecture-regions-20260805

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install workbook parser
        run: python -m pip install --disable-pip-version-check openpyxl

      - name: Generate app data from official workbooks
        env:
          SOURCE_2024_URL: https://www.stat.go.jp/data/zenkokukakei/2024/zuhyou/keizaiken2024.xlsx
          SOURCE_2019_URL: https://www.stat.go.jp/data/zenkokukakei/2019/zuhyou/keizaiken.xlsx
          YAMAGUCHI_SOURCE_URL: https://faq.pref.yamaguchi.lg.jp/faq/detail.aspx?id=1216
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import unicodedata
          import urllib.request
          from collections import OrderedDict
          from pathlib import Path

          from openpyxl import load_workbook

          USER_AGENT = "odekake-data-import/1.0 (+https://github.com/nsaya0607ta-lab/odekake)"
          SOURCE_2024 = os.environ["SOURCE_2024_URL"]
          SOURCE_2019 = os.environ["SOURCE_2019_URL"]
          YAMAGUCHI_SOURCE = os.environ["YAMAGUCHI_SOURCE_URL"]
          CHECKED_AT = "2026-08-06"
          TONES = ["pink", "blue", "green", "yellow", "purple", "teal", "orange", "rose"]

          def download(url: str, destination: Path) -> str:
              request = urllib.request.Request(url, headers={"User-Agent": USER_AGENT})
              with urllib.request.urlopen(request, timeout=90) as response:
                  destination.write_bytes(response.read())
              return hashlib.sha256(destination.read_bytes()).hexdigest()

          def clean(value) -> str:
              if value is None:
                  return ""
              return unicodedata.normalize("NFKC", str(value)).strip()

          def extract_areas(path: Path) -> dict[str, OrderedDict[str, dict]]:
              workbook = load_workbook(path, data_only=True, read_only=True)
              worksheet = next(
                  (sheet for sheet in workbook.worksheets if "市町村一覧" in sheet.title),
                  None,
              )
              if worksheet is None:
                  raise RuntimeError(f"市町村一覧シートが見つかりません: {path}")

              prefectures: dict[str, OrderedDict[str, dict]] = {}
              for row in worksheet.iter_rows(values_only=True):
                  values = [clean(value) for value in row]
                  if len(values) < 7:
                      continue
                  prefecture_code = values[1]
                  prefecture_name = values[2]
                  area_code = values[3]
                  area_name = values[4]
                  municipality_code = values[5]
                  municipality_name = values[6]
                  if not re.fullmatch(r"\d{2}", prefecture_code):
                      continue
                  if not re.fullmatch(r"\d{5}", municipality_code):
                      continue
                  if not area_name:
                      continue

                  area_key = f"{area_code}:{area_name}"
                  areas = prefectures.setdefault(prefecture_code, OrderedDict())
                  area = areas.setdefault(
                      area_key,
                      {
                          "prefectureName": prefecture_name,
                          "sourceAreaCode": area_code,
                          "name": area_name,
                          "sourceMunicipalityCodes": [],
                          "sourceMunicipalityNames": [],
                      },
                  )
                  area["sourceMunicipalityCodes"].append(municipality_code)
                  area["sourceMunicipalityNames"].append(municipality_name)
              return prefectures

          def source_code_matches(source_code: str, current_code: str) -> bool:
              if source_code == current_code:
                  return True
              # 政令指定都市・東京都区部は、公式表では市全体のコード（末尾00）で掲載される。
              # アプリは行政区単位なので、同じ先頭3桁を持つ区へ展開する。
              return source_code.endswith("00") and current_code.startswith(source_code[:3])

          def concise_label(name: str) -> str:
              label = re.sub(r"(?:広域)?(?:圏域|経済圏|圏|地域|地区)$", "", name).strip()
              return label or name

          def slug_of(area_code: str, name: str, index: int) -> str:
              normalized = clean(area_code).lower()
              normalized = re.sub(r"[^a-z0-9]+", "-", normalized).strip("-")
              if normalized:
                  return f"official-{normalized}"
              digest = hashlib.sha1(name.encode("utf-8")).hexdigest()[:7]
              return f"official-{index + 1}-{digest}"

          root = Path(".")
          current_municipalities = json.loads((root / "src/lib/geo/municipalities.json").read_text(encoding="utf-8"))
          current_by_prefecture: dict[str, list[dict]] = {}
          for municipality in current_municipalities:
              current_by_prefecture.setdefault(municipality["prefectureCode"], []).append(municipality)

          file_2024 = Path("/tmp/keizaiken2024.xlsx")
          file_2019 = Path("/tmp/keizaiken2019.xlsx")
          hash_2024 = download(SOURCE_2024, file_2024)
          hash_2019 = download(SOURCE_2019, file_2019)
          areas_2024 = extract_areas(file_2024)
          areas_2019 = extract_areas(file_2019)

          generated: dict[str, list[dict]] = {}
          validation: dict[str, dict] = {}

          for prefecture_code in sorted(current_by_prefecture):
              municipalities = current_by_prefecture[prefecture_code]
              official_2024 = areas_2024.get(prefecture_code, OrderedDict())
              official_2019 = areas_2019.get(prefecture_code, OrderedDict())
              output_areas: OrderedDict[str, dict] = OrderedDict()
              unmatched: list[str] = []

              def resolve_from(source: OrderedDict[str, dict], municipality_code: str):
                  for key, area in source.items():
                      if any(source_code_matches(code, municipality_code) for code in area["sourceMunicipalityCodes"]):
                          return key, area
                  return None

              for municipality in municipalities:
                  municipality_code = municipality["code"]
                  found = resolve_from(official_2024, municipality_code)
                  source_year = 2024
                  if found is None:
                      found = resolve_from(official_2019, municipality_code)
                      source_year = 2019
                  if found is None:
                      unmatched.append(municipality_code)
                      continue

                  key, source_area = found
                  output_key = f"{source_year}:{key}"
                  target = output_areas.setdefault(
                      output_key,
                      {
                          "sourceAreaCode": source_area["sourceAreaCode"],
                          "name": source_area["name"],
                          "municipalityCodes": [],
                          "sourceYear": source_year,
                      },
                  )
                  target["municipalityCodes"].append(municipality_code)

              if unmatched:
                  raise RuntimeError(
                      f"公式区分に割り当てられない市区町村があります: {prefecture_code}: {', '.join(unmatched)}"
                  )

              areas = []
              for index, area in enumerate(output_areas.values()):
                  source_year = area.pop("sourceYear")
                  source_url = SOURCE_2024 if source_year == 2024 else SOURCE_2019
                  areas.append(
                      {
                          "slug": slug_of(area.pop("sourceAreaCode"), area["name"], index),
                          "name": area["name"],
                          "label": concise_label(area["name"]),
                          "tone": TONES[index % len(TONES)],
                          "municipalityCodes": sorted(area["municipalityCodes"]),
                          "sourceKind": "statistics-bureau-economic-area",
                          "sourceTitle": f"令和{6 if source_year == 2024 else '元'}年全国家計構造調査 都道府県内経済圏別市町村一覧",
                          "sourceUrl": source_url,
                      }
                  )

              generated[prefecture_code] = areas
              validation[prefecture_code] = {
                  "municipalityCount": len(municipalities),
                  "areaCount": len(areas),
                  "used2019Fallback": any(
                      area["sourceUrl"] == SOURCE_2019 for area in areas
                  ),
              }

          # 山口県は、県が行政上用いる8圏域を優先する。
          # https://faq.pref.yamaguchi.lg.jp/faq/detail.aspx?id=1216
          yamanashi = None  # 誤って別県へ上書きしないための静的な目印
          del yamanashi
          generated["35"] = [
              {"slug":"iwakuni","name":"岩国圏域","label":"岩国","tone":"pink","municipalityCodes":["35208","35321"]},
              {"slug":"yanai","name":"柳井圏域","label":"柳井","tone":"blue","municipalityCodes":["35212","35305","35341","35343","35344"]},
              {"slug":"shunan","name":"周南圏域","label":"周南","tone":"green","municipalityCodes":["35207","35210","35215"]},
              {"slug":"yamaguchi-hofu","name":"山口・防府圏域","label":"山口・防府","tone":"yellow","municipalityCodes":["35203","35206"]},
              {"slug":"ube-onoda","name":"宇部・小野田圏域","label":"宇部・小野田","tone":"purple","municipalityCodes":["35202","35213","35216"]},
              {"slug":"shimonoseki","name":"下関圏域","label":"下関","tone":"teal","municipalityCodes":["35201"]},
              {"slug":"nagato","name":"長門圏域","label":"長門","tone":"orange","municipalityCodes":["35211"]},
              {"slug":"hagi","name":"萩圏域","label":"萩","tone":"rose","municipalityCodes":["35204","35502"]},
          ]
          for area in generated["35"]:
              area.update(
                  {
                      "sourceKind": "prefecture-administrative-area",
                      "sourceTitle": "山口県 行政上の8圏域",
                      "sourceUrl": YAMAGUCHI_SOURCE,
                  }
              )
          validation["35"] = {
              "municipalityCount": len(current_by_prefecture["35"]),
              "areaCount": len(generated["35"]),
              "used2019Fallback": False,
              "prefectureOverride": True,
          }

          # 最終データが現在の市区町村マスタを重複なく完全に覆うことを検証する。
          for prefecture_code, municipalities in current_by_prefecture.items():
              expected = {municipality["code"] for municipality in municipalities}
              assigned = [
                  code
                  for area in generated[prefecture_code]
                  for code in area["municipalityCodes"]
              ]
              duplicate = sorted({code for code in assigned if assigned.count(code) > 1})
              missing = sorted(expected - set(assigned))
              unknown = sorted(set(assigned) - expected)
              if duplicate or missing or unknown:
                  raise RuntimeError(
                      f"市区町村割当の検証に失敗: {prefecture_code}; "
                      f"duplicate={duplicate}, missing={missing}, unknown={unknown}"
                  )

          if len(generated) != 47:
              raise RuntimeError(f"47都道府県ではありません: {len(generated)}")
          if len(generated["35"]) != 8:
              raise RuntimeError("山口県の公式8圏域が生成されていません")

          output = {
              "schemaVersion": 1,
              "checkedAt": CHECKED_AT,
              "description": "総務省統計局の都道府県内経済圏を全国共通の公的区分として採用し、都道府県が明示する行政区分を優先した市区町村対応表。",
              "sources": [
                  {"title":"令和6年全国家計構造調査 都道府県内経済圏別市町村一覧","url":SOURCE_2024,"sha256":hash_2024},
                  {"title":"令和元年全国家計構造調査 都道府県内経済圏別市町村一覧（欠落補完用）","url":SOURCE_2019,"sha256":hash_2019},
                  {"title":"山口県 行政上の8圏域","url":YAMAGUCHI_SOURCE},
              ],
              "prefectures": generated,
              "validation": validation,
          }

          output_path = root / "src/lib/geo/official-prefecture-areas.json"
          output_path.write_text(json.dumps(output, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          summary_path = root / "docs/official-prefecture-areas.md"
          rows = [
              "# 都道府県内の公式地域区分",
              "",
              f"確認日: {CHECKED_AT}",
              "",
              "全国共通の基準として、総務省統計局の令和6年全国家計構造調査「都道府県内経済圏別市町村一覧」を使用しています。現行市区町村の割当が令和6年資料にない場合のみ、令和元年資料で補完します。都道府県が明示する行政区分を採用した県は、その区分を優先します。",
              "",
              "| 都道府県コード | エリア数 | 市区町村数 | 備考 |",
              "|---:|---:|---:|---|",
          ]
          for prefecture_code in sorted(validation):
              item = validation[prefecture_code]
              notes = []
              if item.get("used2019Fallback"):
                  notes.append("令和元年資料で補完")
              if item.get("prefectureOverride"):
                  notes.append("県の行政区分を優先")
              rows.append(
                  f"| {prefecture_code} | {item['areaCount']} | {item['municipalityCount']} | {'、'.join(notes)} |"
              )
          summary_path.parent.mkdir(parents=True, exist_ok=True)
          summary_path.write_text("\n".join(rows) + "\n", encoding="utf-8")

          print(f"generated {output_path} for {len(generated)} prefectures")
          print(f"official areas: {sum(len(areas) for areas in generated.values())}")
          PY

      - name: Commit validated official data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/geo/official-prefecture-areas.json docs/official-prefecture-areas.md
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Generate official area definitions for all prefectures"
            git push origin HEAD:feat/official-prefecture-regions-20260805
          fi
