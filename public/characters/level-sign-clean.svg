    <circle cx="345" cy="115" r="10"/>
    <circle cx="75" cy="392" r="10"/>
    <circle cx="345" cy="392" r="10"/>
  </g>
  <g fill="#fff0bd" opacity=".8">
    <circle cx="72" cy="111" r="3"/>
    <circle cx="342" cy="111" r="3"/>
    <circle cx="72" cy="388" r="3"/>
    <circle cx="342" cy="388" r="3"/>
