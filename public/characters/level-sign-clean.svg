    <path d="M48 118 C55 161 49 206 53 250 C56 286 49 338 53 389" stroke-width="3"/>
    <path d="M369 122 C363 164 370 210 366 256 C362 302 370 350 365 391" stroke-width="3"/>
    <path d="M73 427 C132 420 193 428 248 423 C294 419 334 426 352 421" stroke-width="3"/>
  </g>

  <!-- screws -->
  <g fill="#efbd63" stroke="#805127" stroke-width="3">
