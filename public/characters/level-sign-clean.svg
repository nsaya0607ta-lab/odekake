<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 556" role="img" aria-label="">
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4cf91"/>
      <stop offset="0.5" stop-color="#e5b66f"/>
      <stop offset="1" stop-color="#c98d4e"/>
    </linearGradient>
    <linearGradient id="woodLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8d89e"/>
      <stop offset="1" stop-color="#dda45f"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f6e8c8"/>
    </linearGradient>
  </defs>

  <!-- top pegs -->
  <path d="M148 72 L157 16 Q160 5 171 6 L187 8 Q197 10 195 21 L188 72 Z" fill="url(#woodLight)" stroke="#8f5b2c" stroke-width="5" stroke-linejoin="round"/>
  <path d="M236 72 L233 18 Q233 7 244 6 L260 6 Q271 7 272 19 L276 72 Z" fill="url(#woodLight)" stroke="#8f5b2c" stroke-width="5" stroke-linejoin="round"/>
  <path d="M166 16 L160 63 M177 15 L172 63 M247 14 L250 63 M258 14 L262 63" stroke="#c08143" stroke-width="3" opacity=".65"/>

  <!-- leaves -->
  <path d="M42 101 C12 96 4 73 8 56 C28 58 46 68 51 89 C50 94 47 98 42 101Z" fill="#9fbd5c" stroke="#6f7e35" stroke-width="4"/>
