  <!-- grass right -->
  <g fill="#82a74a" stroke="#5f7932" stroke-width="3" stroke-linejoin="round">
    <path d="M346 548 C347 530 342 519 334 509 C332 527 334 538 337 548Z"/>
    <path d="M351 548 C357 529 367 520 379 516 C372 532 364 542 359 548Z"/>
    <path d="M339 548 C331 532 321 527 311 527 C322 540 330 546 339 548Z"/>
  </g>

  <!-- flower -->
  <g transform="translate(375 502)">
    <path d="M0 20 C0 33 -2 42 -5 50" stroke="#66823d" stroke-width="4" fill="none"/>
    <g fill="#fffaf2" stroke="#b99b78" stroke-width="2">
      <ellipse cx="0" cy="0" rx="7" ry="13"/>
      <ellipse cx="0" cy="0" rx="7" ry="13" transform="rotate(60)"/>
      <ellipse cx="0" cy="0" rx="7" ry="13" transform="rotate(120)"/>
