  <!-- easel legs -->
  <path d="M91 431 L138 431 L111 535 Q109 545 99 548 L69 548 Q58 546 62 534 Z" fill="url(#woodLight)" stroke="#8a5429" stroke-width="6" stroke-linejoin="round"/>
  <path d="M281 431 L329 431 L359 534 Q362 545 351 548 L321 548 Q311 546 309 535 Z" fill="url(#woodLight)" stroke="#8a5429" stroke-width="6" stroke-linejoin="round"/>
  <path d="M205 432 L227 432 L228 516 Q228 525 219 527 L211 527 Q202 525 202 516 Z" fill="#c88a49" stroke="#8a5429" stroke-width="5"/>
  <path d="M107 472 L321 472 L316 505 L112 505 Z" fill="url(#wood)" stroke="#8a5429" stroke-width="6" stroke-linejoin="round"/>
  <circle cx="214" cy="488" r="6" fill="#dfaa60" stroke="#805127" stroke-width="3"/>
  <path d="M124 445 L106 529 M308 445 L329 529 M127 486 L302 486" stroke="#b87439" stroke-width="3" opacity=".55"/>

