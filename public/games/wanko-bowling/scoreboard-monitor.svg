<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-label="Bowling score monitor background">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4149"/>
      <stop offset="0.48" stop-color="#171c22"/>
      <stop offset="1" stop-color="#080b0f"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102b35"/>
      <stop offset="0.55" stop-color="#071b24"/>
      <stop offset="1" stop-color="#06131a"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".14"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect x="10" y="10" width="1180" height="240" rx="34" fill="url(#bezel)" filter="url(#shadow)"/>
  <rect x="28" y="27" width="1144" height="206" rx="22" fill="#05080b" stroke="#69747d" stroke-width="3"/>
  <rect x="39" y="38" width="1122" height="184" rx="15" fill="url(#screen)" stroke="#2f6570" stroke-width="2"/>

  <!-- frame columns: five frames + total -->
  <g stroke="#67a8b1" stroke-opacity=".58" stroke-width="2">
    <line x1="216" y1="38" x2="216" y2="222"/>
    <line x1="393" y1="38" x2="393" y2="222"/>
    <line x1="570" y1="38" x2="570" y2="222"/>
    <line x1="747" y1="38" x2="747" y2="222"/>
    <line x1="924" y1="38" x2="924" y2="222"/>
    <line x1="39" y1="96" x2="1161" y2="96"/>
    <line x1="39" y1="153" x2="924" y2="153"/>
  </g>

  <!-- small roll-box accents -->
  <g fill="none" stroke="#d8b75f" stroke-opacity=".72" stroke-width="2">
    <rect x="135" y="96" width="81" height="57"/>
    <rect x="312" y="96" width="81" height="57"/>
    <rect x="489" y="96" width="81" height="57"/>
    <rect x="666" y="96" width="81" height="57"/>
    <rect x="830" y="96" width="94" height="57"/>
  </g>

  <rect x="39" y="38" width="1122" height="184" rx="15" fill="url(#shine)" pointer-events="none"/>
  <circle cx="53" cy="23" r="3" fill="#9aa3aa"/>
  <circle cx="1147" cy="23" r="3" fill="#9aa3aa"/>
  <circle cx="53" cy="237" r="3" fill="#4b5258"/>
  <circle cx="1147" cy="237" r="3" fill="#4b5258"/>
</svg>
